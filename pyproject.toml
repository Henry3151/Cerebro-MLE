[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-mle"
version = "0.1.0"
description = "Cérebro MLE: base de conhecimento local (RAG) conectada ao Claude que transforma um problema de ML Engineering em mapa de arquitetura e roteiro."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Henrique Silva" }]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "mcp>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
cerebro = "cerebro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cerebro = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
